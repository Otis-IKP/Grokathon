[project]
name = "nepo-bot"
version = "0.1.0"
description = "Yale NEPO — Claude iMessage bot for warm club intros (Grokathon 2026)"
readme = "README.md"
authors = [
    { name = "Tobi Bamisaye", email = "tobi.bamisaye@yale.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nepo-repl = "nepo_bot.scripts_entry:repl_main"
nepo-serve = "nepo_bot.scripts_entry:serve_main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
